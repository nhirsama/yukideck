name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate SemVer Tag
    runs-on: ubuntu-latest
    outputs:
      is_valid: ${{ steps.semver.outputs.is_valid }}
      is_prerelease: ${{ steps.semver.outputs.is_prerelease }}
      version: ${{ steps.semver.outputs.version }}
    steps:
      - name: Validate semantic version tag
        id: semver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          SEMVER_REGEX='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ "$TAG" =~ $SEMVER_REGEX ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            prerelease="${BASH_REMATCH[5]}"

            version="${major}.${minor}.${patch}"
            is_prerelease="false"
            if [[ -n "$prerelease" ]]; then
              version="${version}-${prerelease}"
              is_prerelease="true"
            fi

            echo "is_valid=true" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "Valid SemVer tag: ${TAG} (version=${version}, prerelease=${is_prerelease})"
          else
            echo "is_valid=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag '${TAG}' is not a valid SemVer 2.0.0 version; skipping release."
          fi

  test:
    name: Run Backend Tests
    needs: validate
    if: needs.validate.outputs.is_valid == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run Go unit tests
        working-directory: backend
        run: go test -race -v ./...

  docker:
    name: Build & Push Multi-Arch Image
    needs: [validate, test]
    if: needs.validate.outputs.is_valid == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=yukideck-release
          cache-to: type=gha,mode=max,scope=yukideck-release
          provenance: false

  collector:
    name: Build Collector (${{ matrix.name }})
    needs: validate
    if: needs.validate.outputs.is_valid == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin_ext: ''
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bin_ext: ''
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: '.exe'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'collector -> target'
          key: ${{ matrix.target }}
          shared-key: collector-${{ matrix.target }}

      - name: Run unit tests
        working-directory: collector
        env:
          YUKIDECK_COLLECTOR_VERSION: ${{ needs.validate.outputs.version }}
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        working-directory: collector
        env:
          YUKIDECK_COLLECTOR_VERSION: ${{ needs.validate.outputs.version }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test binary
        shell: bash
        run: |
          ./collector/target/${{ matrix.target }}/release/yukideck-collector${{ matrix.bin_ext }} --version

      - name: Stage release binary
        shell: bash
        run: |
          mkdir -p dist
          cp "collector/target/${{ matrix.target }}/release/yukideck-collector${{ matrix.bin_ext }}" \
            "dist/yukideck-collector-${{ matrix.name }}${{ matrix.bin_ext }}"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: yukideck-collector-${{ matrix.name }}
          path: dist/yukideck-collector-${{ matrix.name }}${{ matrix.bin_ext }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [validate, docker, collector]
    if: needs.validate.outputs.is_valid == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download collector artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: yukideck-collector-*
          path: dist
          merge-multiple: true

      - name: Generate collector checksums
        run: |
          cd dist
          sha256sum yukideck-collector-* | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          IS_PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
          DIGEST: ${{ needs.docker.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          IMAGE="${REGISTRY}/${REPO,,}"
          NOTES=$(cat <<EOF
          ### Docker Image

          Embedded frontend single-binary image (\`linux/amd64\`, \`linux/arm64\`):

          \`\`\`bash
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          - **Image**: \`${IMAGE}:${VERSION}\`
          - **Digest**: \`${DIGEST}\`

          ### Collector Binaries (\`yukideck-collector\`)

          Prebuilt local probe binaries attached to this release (see \`SHA256SUMS.txt\`):

          - \`yukideck-collector-linux-amd64\`
          - \`yukideck-collector-macos-arm64\`
          - \`yukideck-collector-windows-amd64.exe\`
          EOF
          )

          ARGS=(--title "${TAG}" --notes "${NOTES}")
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" "${ARGS[@]}"
          else
            gh release create "${TAG}" "${ARGS[@]}" --generate-notes
          fi

          gh release upload "${TAG}" dist/yukideck-collector-* dist/SHA256SUMS.txt --clobber
