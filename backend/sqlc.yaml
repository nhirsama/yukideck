    queries: "internal/core/auth/queries.sql"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/core/auth/sqlcgen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
